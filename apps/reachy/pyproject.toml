# Reachy target — the thin Python ReachyMiniApp bootstrap (Layer 3).
#
# Base deps stay EMPTY so CI and dev installs are instant; everything real
# rides the `robot` extra. pymaxim's own `reachy` extra owns the SDK pin
# (`reachy-mini[gstreamer]>=1.8.3,<2.0` in pymaxim's pyproject) — we do not
# double-pin it here, so the version-match-after-reflash rule has one owner.
# This target versions on Pollen's SDK cadence (CLAUDE.md § Versioning).
[project]
name = "maxim-reachy-app"
version = "0.3.0"
description = "Maxim on Reachy Mini — ReachyMiniApp bootstrap serving the on-device UI bundle over pymaxim's embodied HANDLE."
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://pymaxim.bio"
# The HF Space listing and the privacy-posture blurb (Phase 2) must link the
# docs site (what leaves the robot, what lands in ~/.maxim/, mesh-vs-cloud
# data flow).
Documentation = "https://docs.pymaxim.bio"

# How Pollen's daemon discovers the app (`reachy_mini_apps` group). The entry
# point NAME must equal the package directory: the wireless daemon reads
# `<name>/main.py` for the `custom_app_url` literal at listing time.
[project.entry-points."reachy_mini_apps"]
maxim_reachy_app = "maxim_reachy_app.main:MaximReachyApp"

[project.optional-dependencies]
# console = maxim serve's FastAPI/uvicorn; reachy = the Pollen SDK pin.
# >=1.2.1 is the first RELEASE with everything the device sign-in path needs:
# console contract 0.5.0 (/api/pair/*, A9.1) plus make_pairing_announcer and
# make_device_speak_sink, which this bootstrap wires. On 1.1.x the robot has no
# usable sign-in path at all. Bump deliberately (CLAUDE.md § Versioning).
# `tts` is not optional here: the pairing announcer synthesizes the spoken code
# with piper-tts, which lives in pymaxim's `tts` extra, NOT `reachy` or
# `console`. Without it the announcer fails (ImportError, logged by type only)
# while the sign-in page tells the owner to listen — a silent dead end, since
# the 202 deliberately does not reveal announcer health to tokenless callers.
robot = ["pymaxim[console,reachy,tts]>=1.2.1,<2.0"]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make `python -m pytest apps/reachy -q` work from the repo root (CLAUDE.md/CI)
# without installing the package: put this directory on sys.path.
pythonpath = ["."]
