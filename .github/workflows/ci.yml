name: CI

on:
  push:
    branches: [main]
    tags: ['v*'] # tagging publishes the UI bundles pymaxim vendors
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach dist bundles to the release on a tag
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The facade contract: generated schema.ts must match the committed
      # openapi.json snapshot (mirrors pymaxim's src/maxim/console/openapi.json).
      - run: pnpm --filter @maxim/kit gen:facade:check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The code-split guard: heavy viz must never enter the Reachy on-device bundle.
      - run: pnpm size:reachy

      # The console-dist handoff: Python serves these bundles, so package them
      # for vendoring into the pymaxim wheel (`maxim serve` with no --ui-dist).
      - run: pnpm dist:pack
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: artifacts/*.tar.gz
          if-no-files-found: error
      # A tag is the ONLY durable home these bundles have — dist/ is gitignored
      # on both sides, so without this the artifact exists nowhere pymaxim can
      # vendor from. A PUBLISHED asset is immutable: pymaxim vendors it and pins
      # its sha256, so a re-run of a tag's CI (or a second push of the tag) must
      # never replace it (no --clobber, ever). Only an asset the release lacks is
      # uploaded; an existing one is left exactly as published.
      - name: Publish bundles to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" artifacts/*.tar.gz --title "$tag" --generate-notes
          else
            published="$(gh release view "$tag" --json assets --jq '.assets[].name')"
            for asset in artifacts/*.tar.gz; do
              name="$(basename "$asset")"
              if grep -qxF "$name" <<<"$published"; then
                echo "::notice::$tag already publishes $name; leaving it untouched (published assets are immutable)"
              else
                gh release upload "$tag" "$asset" # no --clobber: refuses if it appeared meanwhile
              fi
            done
          fi
          gh release view "$tag" --json assets \
            --jq '.assets[].name' | sort | tee /dev/stderr | grep -qx 'console-dist.tar.gz'

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff pytest
      - run: ruff check apps/reachy scripts e2e
      - run: ruff format --check apps/reachy scripts e2e
      - run: python -m pytest apps/reachy -q
